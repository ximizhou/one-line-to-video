[project]
name = "one-line-to-video"
version = "0.1.0"
description = "Agentic service that turns one line into a short-form AI video"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",  # SSE framing + keep-alive ping + client-disconnect detection
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",  # resume: prod checkpointer (uses psycopg)
    "psycopg[binary]>=3.1",                # driver for the postgres checkpointer
    "langchain-core>=0.3.0",
    "google-genai>=0.3.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tenacity>=8.3",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "slowapi>=0.1.9",        # per-IP rate limit on the public create endpoint
    "httpx>=0.27",           # Turnstile siteverify (also used by tests)
]

[project.urls]
Repository = "https://github.com/ximizhou/one-line-to-video"
Issues = "https://github.com/ximizhou/one-line-to-video/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",  # coverage report (Workstream 1-5: comprehensive new-code coverage)
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0",  # resume checkpointer for sqlite (tests/local dev)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
